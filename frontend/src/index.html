<!doctype html>
<html lang="es" class="theme-dark">
  <head>
    <meta charset="utf-8" />
    <title>PetLink</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="72x72" href="icons/icon-72x72.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f131d" />
    <script>
      (() => {
        let theme = 'dark';
        try {
          theme = localStorage.getItem('petlink-theme') === 'light' ? 'light' : 'dark';
        } catch {}

        document.documentElement.classList.toggle('theme-light', theme === 'light');
        document.documentElement.classList.toggle('theme-dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#0f131d' : '#f7f9fd');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Activa JavaScript para utilizar PetLink.</noscript>
  </body>
</html>
